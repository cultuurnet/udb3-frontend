name: Visual Regression Tests (Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

concurrency:
  group: vrt-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vrt-pages:
    if: |
      github.event_name == 'push' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      NEXT_PUBLIC_ENVIRONMENT: ${{ secrets.NEXT_PUBLIC_ENVIRONMENT }}
      NEXT_PUBLIC_API_KEY: ${{ secrets.NEXT_PUBLIC_API_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
      NEXT_PUBLIC_LEGACY_APP_URL: ${{ secrets.NEXT_PUBLIC_LEGACY_APP_URL }}
      NEXT_PUBLIC_AUTH_URL: ${{ secrets.NEXT_PUBLIC_AUTH_URL }}
      NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL }}
      NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
      NEXT_PUBLIC_NEW_ANNOUNCEMENTS_URL: ${{ secrets.NEXT_PUBLIC_NEW_ANNOUNCEMENTS_URL }}
      NEXT_PUBLIC_NEWSLETTER_EMAIL_LIST_ID: ${{ secrets.NEXT_PUBLIC_NEWSLETTER_EMAIL_LIST_ID }}
      NEXT_PUBLIC_TAXONOMY_URL: ${{ secrets.NEXT_PUBLIC_TAXONOMY_URL }}
      NEXT_PUBLIC_CULTUURKUUR_LOCATION_ID: ${{ secrets.NEXT_PUBLIC_CULTUURKUUR_LOCATION_ID }}
      NEXT_PUBLIC_UIV_URL: ${{ secrets.NEXT_PUBLIC_UIV_URL }}
      NEXT_PUBLIC_CK_URL: ${{ secrets.NEXT_PUBLIC_CK_URL }}
      NEXT_PUBLIC_UDB_PUBLICATION_RULES_URL: ${{ secrets.NEXT_PUBLIC_UDB_PUBLICATION_RULES_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_BASE_URL: ${{ secrets.AUTH_BASE_URL }}
      AUTH_ISSUER_BASE_URL: ${{ secrets.AUTH_ISSUER_BASE_URL }}
      AUTH_CLIENT_ID: ${{ secrets.AUTH_CLIENT_ID }}
      AUTH_CLIENT_SECRET: ${{ secrets.AUTH_CLIENT_SECRET }}
      E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
      E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Build Next.js application
        run: yarn build

      - name: Run page VRT
        run: yarn vrt:pages

      - name: List failing images
        if: failure()
        run: |
          if [ -d .lostpixel-pages/difference ] && [ "$(ls -A .lostpixel-pages/difference)" ]; then
            echo "Differences found in:"
            ls -1 .lostpixel-pages/difference/
          fi

      - name: Upload difference images
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vrt-pages-differences
          path: .lostpixel-pages/difference/
          retention-days: 7
